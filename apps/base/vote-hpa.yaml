apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: vote-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Rollout
    name: vote

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../base

patches:
  - target:
      kind: Rollout
      name: vote
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

images:
  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/vote-app
    newTag: v1.0.0

  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/result-app
    newTag: v1.0.0

  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/worker-app
    newTag: v1.0.0

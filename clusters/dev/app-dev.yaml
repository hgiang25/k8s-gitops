apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hgiang25/k8s-gitops.git
    targetRevision: main
    path: apps/dev

  destination:
    name: dev-cluster
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
